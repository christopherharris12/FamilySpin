spring.application.name=FamilySpin
server.port=8081
family.spin.members=Mere Regine, Daddy Chriss, Arsene, Festus, Paccy, kevine, Kevin, Daniel, ange, Divine Muto, Divine Mukuru, Egide, Penuelle, Caline, Ebenezel, Theophilus, Emelyne, Coco, Vava, Raymond, Yva, Yves, Caleddy, Moise, Simba, Yannick, Irene, Esther, Lenatha, Janvier,J Aime, Christian, Elysee, Florence, Eric, Gihozo, Honore, Pablo, Marvel, Chouchoute
family.spin.weekly-cron=0 0 0 * * MON

# H2 Database - File-based persistence with proper configuration
spring.datasource.url=jdbc:h2:file:./data/familydb;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 specific settings for better persistence
spring.h2.console.enabled=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# Connection pool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000