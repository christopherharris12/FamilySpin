<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Ebenezer Family Spin</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #c2410c;
            --primary-dark: #9a2d06;
            --secondary: #0f766e;
            --accent: #f59e0b;
            --bg-light: #fef3e2;
            --bg-dark: #1f2937;
            --text: #1f2937;
            --text-light: #6b7280;
            --white: #ffffff;
            --error: #dc2626;
        }

        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        body {
            font-family: 'Segoe UI', Trebuchet MS, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e2a47 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(242, 158, 11, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(194, 65, 12, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(20px); }
        }

        .login-wrapper {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
            z-index: 1;
            flex-wrap: wrap;
        }

        .branding-section {
            flex: 1;
            min-width: 300px;
            color: var(--white);
            text-align: center;
        }

        .family-logo {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .family-name {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .family-tagline {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .features-list {
            text-align: left;
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            font-size: 24px;
            margin-right: 15px;
            min-width: 30px;
            text-align: center;
        }

        .login-container {
            background: var(--white);
            border-radius: 25px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        button {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(194, 65, 12, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(194, 65, 12, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: #fecaca;
            color: #991b1b;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 4px solid var(--error);
            font-weight: 500;
            font-size: 14px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        .auth-footer-text {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .auth-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .auth-link:hover {
            color: var(--primary-dark);
            transform: translateX(3px);
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .marquee-slogan {
            display: inline-block;
            animation: marquee 8s linear infinite;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                gap: 30px;
            }

            .branding-section {
                display: none;
            }

            .family-name {
                font-size: 36px;
            }

            .login-container {
                padding: 40px 25px;
            }

            .login-title {
                font-size: 28px;
            }

            body::before {
                width: 300px;
                height: 300px;
                right: -20%;
                top: -30%;
            }

            body::after {
                width: 250px;
                height: 250px;
                left: -15%;
                bottom: -20%;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="branding-section">
            <span class="family-logo">🎡</span>
            <h1 class="family-name">Ebenezer</h1>
            <p class="family-tagline">Family Spin</p>
            <p style="font-size: 14px; color: rgba(255,255,255,0.9); font-weight: 500; margin-top: 12px; letter-spacing: 0.5px; overflow: hidden; width: 100%; height: 22px; line-height: 22px;"><span class="marquee-slogan">💝 Love be Forward 💝</span></p>
            
            <div class="features-list">
                <div class="feature-item">
                    <span class="feature-icon">👨‍👩‍👧‍👦</span>
                    <span>Family Connected</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🎯</span>
                    <span>Fun & Engaging</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🏆</span>
                    <span>Weekly Selection</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">✨</span>
                    <span>Friend of the Week</span>
                </div>
            </div>
        </div>

        <div class="login-container">
            <div class="login-header">
                <h2 class="login-title">Welcome Back</h2>
                <p class="login-subtitle">Sign in to your account</p>
            </div>

            <div class="divider"></div>

            <div th:if="${error}" class="error" th:text="${error}"></div>

            <form method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required />
                </div>

                <button type="submit">Sign In</button>
            </form>

            <div class="auth-footer">
                <p class="auth-footer-text">Don't have an account?</p>
                <a href="/register" class="auth-link">→ Create Account</a>
            </div>
        </div>
    </div>
</body>
</html>
