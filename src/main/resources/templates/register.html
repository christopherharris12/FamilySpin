<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Ebenezer Family Spin</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #c2410c;
            --primary-dark: #9a2d06;
            --secondary: #0f766e;
            --accent: #f59e0b;
            --bg-light: #fef3e2;
            --bg-dark: #1f2937;
            --text: #1f2937;
            --text-light: #6b7280;
            --white: #ffffff;
            --error: #dc2626;
        }

        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        body {
            font-family: 'Segoe UI', Trebuchet MS, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e2a47 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(242, 158, 11, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(194, 65, 12, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(20px); }
        }

        .register-container {
            background: var(--white);
            border-radius: 25px;
            padding: 50px 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .register-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .register-logo {
            font-size: 60px;
            display: block;
            margin-bottom: 15px;
        }

        .register-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .register-subtitle {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c2410c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
            padding-right: 40px;
        }

        select option {
            background: white;
            color: var(--text);
        }

        button {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(194, 65, 12, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(194, 65, 12, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: #fecaca;
            color: #991b1b;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 4px solid var(--error);
            font-weight: 500;
            font-size: 14px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        .auth-footer-text {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .auth-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .auth-link:hover {
            color: var(--primary-dark);
            transform: translateX(3px);
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .marquee-slogan {
            display: inline-block;
            animation: marquee 8s linear infinite;
            white-space: nowrap;
        }

        .info-box {
            background: rgba(194, 65, 12, 0.05);
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: #7a2e0a;
            margin-bottom: 20px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .register-container {
                padding: 40px 25px;
            }

            .register-title {
                font-size: 28px;
            }

            body::before {
                width: 300px;
                height: 300px;
                right: -20%;
                top: -30%;
            }

            body::after {
                width: 250px;
                height: 250px;
                left: -15%;
                bottom: -20%;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <span class="register-logo">🎡</span>
            <h1 class="register-title">Join The Family</h1>
            <p class="register-subtitle">Create your account to play</p>
            <p style="font-size: 13px; color: #c2410c; font-weight: 600; margin-top: 12px; letter-spacing: 1px; overflow: hidden; width: 100%; height: 20px; line-height: 20px;"><span class="marquee-slogan">💝 Love be Forward 💝</span></p>
        </div>

        <div class="divider"></div>

        <div class="info-box">
            🌟 Every family member gets one spin per session. Make it count!
        </div>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required />
            </div>

            <div class="form-group">
                <label for="familyMemberName">👨‍👩‍👧‍👦 Your Family Member Name</label>
                <select id="familyMemberName" name="familyMemberName" required>
                    <option value="">-- Select your name --</option>
                    <option th:each="member : ${familyMembers}" th:value="${member}" th:text="${member}"></option>
                </select>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <div class="auth-footer">
            <p class="auth-footer-text">Already a member?</p>
            <a href="/login" class="auth-link">→ Sign In</a>
        </div>
    </div>
</body>
</html>
